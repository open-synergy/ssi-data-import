scenarios:
  - name: "Create Data Import With Template Defaults"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "partner_model"
      - step: "Create template"
        action: "create"
        model: "data_import_template"
        save_as: "template"
        values:
          name: "Import Template A"
          code: "/"
          model_id: "REC: partner_model.id"
      - step: "Create data_import with only template_id"
        action: "create"
        model: "data_import"
        save_as: "document"
        values:
          template_id: "REC: template.id"
      - step: "Assert defaults"
        action: "assert"
        target: "document"
        asserts:
          state:
            type: "value"
            expected: "draft"
          num_of_data:
            type: "value"
            expected: 0
          import_file_hash:
            type: "value"
            operator: "is_falsy"
          date:
            type: "value"
            operator: "is_truthy"

  - name: "Reject Duplicate File Hash"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "partner_model"
      - step: "Create template"
        action: "create"
        model: "data_import_template"
        save_as: "template"
        values:
          name: "Import Template B"
          code: "/"
          model_id: "REC: partner_model.id"
      - step: "Create first document with a file hash"
        action: "create"
        model: "data_import"
        save_as: "first_document"
        values:
          template_id: "REC: template.id"
          import_file_hash: "deadbeefcafef00d"
      - step: "Second document with the same hash must fail"
        action: "create"
        model: "data_import"
        expect_error:
          type: "ValidationError"
        values:
          template_id: "REC: template.id"
          import_file_hash: "deadbeefcafef00d"

  - name: "Reject Load Data Outside Draft"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "partner_model"
      - step: "Create template"
        action: "create"
        model: "data_import_template"
        save_as: "template"
        values:
          name: "Import Template C"
          code: "/"
          model_id: "REC: partner_model.id"
      - step: "Create document"
        action: "create"
        model: "data_import"
        save_as: "document"
        values:
          template_id: "REC: template.id"
      - step: "Confirm the document"
        action: "call"
        target: "document"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Load Data outside Draft must fail"
        action: "call"
        target: "document"
        method: "action_load_data"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"

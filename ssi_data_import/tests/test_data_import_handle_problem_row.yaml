scenarios:
  - name: "Edit Wizard Fixes Error Row And Returns It To Draft"
    steps:
      - step: "Create template"
        action: "create"
        model: "data_import_template"
        save_as: "template"
        values:
          name: "Handle Row Template One"
          code: "/"
          model_id: "REF: base.model_res_partner"
          on_no_match: "error"
          on_multi_match: "error"
          matcher_ids:
            - - 0
              - 0
              - field_path: "vat"
                column: "vat"
                operator: "="
                required: true
      - step: "Create document"
        action: "create"
        model: "data_import"
        save_as: "document"
        values:
          template_id: "REC: template.id"
      - step: "Create data line with empty vat column"
        action: "create"
        model: "data_import.data"
        save_as: "line"
        values:
          import_id: "REC: document.id"
          sequence: 10
          data: '{"vat": ""}'
      - step: "Resolve"
        action: "call"
        target: "document"
        method: "action_resolve"
      - step: "Assert line is Error"
        action: "assert"
        target: "line"
        asserts:
          state:
            type: "value"
            expected: "error"
      - step: "Edit the row's JSON via the wizard"
        action: "wizard"
        model: "edit_data_import_row"
        target: "line"
        values:
          data: '{"vat": "HANDLEV001"}'
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "draft"
          error_message:
            type: "value"
            operator: "is_falsy"

  - name: "Edit Wizard Rejects Non-Object JSON"
    steps:
      - step: "Create template"
        action: "create"
        model: "data_import_template"
        save_as: "template"
        values:
          name: "Handle Row Template Two"
          code: "/"
          model_id: "REF: base.model_res_partner"
          on_no_match: "error"
          on_multi_match: "error"
          matcher_ids:
            - - 0
              - 0
              - field_path: "vat"
                column: "vat"
                operator: "="
                required: true
      - step: "Create document"
        action: "create"
        model: "data_import"
        save_as: "document"
        values:
          template_id: "REC: template.id"
      - step: "Create data line with empty vat column"
        action: "create"
        model: "data_import.data"
        save_as: "line"
        values:
          import_id: "REC: document.id"
          sequence: 10
          data: '{"vat": ""}'
      - step: "Resolve"
        action: "call"
        target: "document"
        method: "action_resolve"
      - step: "Edit with a JSON array instead of an object must fail"
        action: "wizard"
        model: "edit_data_import_row"
        target: "line"
        values:
          data: '["not", "an", "object"]'
        method: "action_confirm"
        expect_error:
          type: "UserError"

  - name: "Ignore Wizard Marks No Match Row Ignored With Reason"
    steps:
      - step: "Create template"
        action: "create"
        model: "data_import_template"
        save_as: "template"
        values:
          name: "Handle Row Template Three"
          code: "/"
          model_id: "REF: base.model_res_partner"
          on_no_match: "error"
          on_multi_match: "error"
          matcher_ids:
            - - 0
              - 0
              - field_path: "vat"
                column: "vat"
                operator: "="
                required: true
      - step: "Create document"
        action: "create"
        model: "data_import"
        save_as: "document"
        values:
          template_id: "REC: template.id"
      - step: "Create data line whose vat matches nothing"
        action: "create"
        model: "data_import.data"
        save_as: "line"
        values:
          import_id: "REC: document.id"
          sequence: 10
          data: '{"vat": "HANDLEV003"}'
      - step: "Resolve"
        action: "call"
        target: "document"
        method: "action_resolve"
      - step: "Assert line is No Match"
        action: "assert"
        target: "line"
        asserts:
          state:
            type: "value"
            expected: "no_match"
      - step: "Ignore the row via the wizard"
        action: "wizard"
        model: "ignore_data_import_row"
        target: "line"
        values:
          reason: "Row reason text"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "ignored"
          ignore_reason:
            type: "value"
            expected: "Row reason text"

  - name: "Ignore Wizard Rejects Empty Reason"
    steps:
      - step: "Create template"
        action: "create"
        model: "data_import_template"
        save_as: "template"
        values:
          name: "Handle Row Template Four"
          code: "/"
          model_id: "REF: base.model_res_partner"
          on_no_match: "error"

      - step: "Assert document reached Done"
        action: "assert"
        target: "document"
        asserts:
          state:
            type: "value"
            expected: "done"
      - step: "Cancel the Done document (bypasses the reason wizard here)"
        action: "call"
        target: "document"
        method: "action_queue_cancel"
        as_user: "base.user_admin"
        context:
          queue_job__no_delay: true
      - step: "Assert document reached Cancel"
        action: "assert"
        target: "document"
        asserts:
          state:
            type: "value"
            expected: "cancel"
      - step: "Assert target keeps the applied value after Cancel"
        action: "assert"
        target: "partner"
        asserts:
          name:
            type: "value"
            expected: "Name Applied Before Cancel"
      - step: "Assert the Done Data line was not reverted"
        action: "assert"
        target: "line"
        asserts:
          state:
            type: "value"
            expected: "done"

        save_as: "partner"
        values:
          name: "Apply Partner Four"
          ref: "APPLYREF004"
      - step: "Create first existing Invoice contact"
        action: "create"
        model: "res.partner"
        save_as: "child_one"
        values:
          name: "Invoice Contact One"
          type: "invoice"
          parent_id: "REC: partner.id"
      - step: "Create second existing Invoice contact"
        action: "create"
        model: "res.partner"
        save_as: "child_two"
        values:
          name: "Invoice Contact Two"
          type: "invoice"
          parent_id: "REC: partner.id"
      - step: "Create template"
        action: "create"
        model: "data_import_template"
        save_as: "template"
        values:
          name: "Apply Template Four"
          code: "/"
          model_id: "REF: base.model_res_partner"
          on_no_match: "error"

        save_as: "line"
        values:
          import_id: "REC: document.id"
          sequence: 10
          data: '{"vat": "APPLYV005", "name": "Name Applied Before Cancel"}'
      - step: "Resolve"
        action: "call"
        target: "document"
        method: "action_resolve"
      - step: "Confirm"
        action: "call"
        target: "document"
        method: "action_confirm"
        as_user: "base.user_admin"
      # WAJIB: memaksa _refresh() (flush + invalidate) sebelum approve_ok
      # dibaca. Tanpa step ini approve_ok terbaca dari cache yang diisi

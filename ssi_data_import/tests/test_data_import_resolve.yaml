scenarios:
  - name: "Resolve Matches A Single Partner"
    steps:
      - step: "Create target partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Resolve Partner One"
          vat: "RESOLVEV001"
      - step: "Create template"
        action: "create"
        model: "data_import_template"
        save_as: "template"
        values:
          name: "Resolve Template One"
          code: "/"
          model_id: "REF: base.model_res_partner"
          on_no_match: "error"
          on_multi_match: "error"
          matcher_ids:
            - - 0
              - 0
              - field_path: "vat"
                column: "vat"
                operator: "="
                required: true
      - step: "Create document"
        action: "create"
        model: "data_import"
        save_as: "document"
        values:
          template_id: "REC: template.id"
      - step: "Create data line"
        action: "create"
        model: "data_import.data"
        save_as: "line"
        values:
          import_id: "REC: document.id"
          sequence: 10
          data: '{"vat": "RESOLVEV001"}'
      - step: "Run Resolve"
        action: "call"
        target: "document"
        method: "action_resolve"
      - step: "Assert line matched to the partner"
        action: "assert"
        target: "line"
        asserts:
          state:
            type: "value"
            expected: "matched"
          source_document_res_id:
            type: "value"
            expected: "REC: partner.id"
      - step: "Assert target partner untouched"
        action: "assert"
        target: "partner"
        asserts:
          vat:
            type: "value"
            expected: "RESOLVEV001"
          name:
            type: "value"
            expected: "Resolve Partner One"

  - name: "Resolve Runs Idempotently"
    steps:
      - step: "Create target partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Resolve Partner Two"
          vat: "RESOLVEV002"
      - step: "Create template"
        action: "create"
        model: "data_import_template"
        save_as: "template"
        values:
          name: "Resolve Template Two"
          code: "/"
          model_id: "REF: base.model_res_partner"
          on_no_match: "error"
          on_multi_match: "error"
          matcher_ids:
            - - 0
              - 0
              - field_path: "vat"
                column: "vat"
                operator: "="
                required: true
      - step: "Create document"
        action: "create"
        model: "data_import"
        save_as: "document"
        values:
          template_id: "REC: template.id"
      - step: "Create data line"
        action: "create"
        model: "data_import.data"
        save_as: "line"
        values:
          import_id: "REC: document.id"
          sequence: 10
          data: '{"vat": "RESOLVEV002"}'
      - step: "Run Resolve first time"
        action: "call"
        target: "document"
        method: "action_resolve"
      - step: "Assert matched after first run"
        action: "assert"
        target: "document"
        asserts:
          num_of_data:
            type: "value"
            expected: 1
          num_of_matched:
            type: "value"
            expected: 1
      - step: "Run Resolve second time"
        action: "call"
        target: "document"
        method: "action_resolve"
      - step: "Assert still matched, no duplicate lines"
        action: "assert"
        target: "document"
        asserts:
          num_of_data:
            type: "value"
            expected: 1
          num_of_matched:
            type: "value"
            expected: 1
      - step: "Assert line still matched to the same partner"
        action: "assert"
        target: "line"
        asserts:
          state:
            type: "value"
            expected: "matched"
          source_document_res_id:
            type: "value"
            expected: "REC: partner.id"


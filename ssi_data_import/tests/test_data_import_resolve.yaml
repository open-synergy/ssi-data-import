          on_multi_match: "error"
          matcher_ids:
            - - 0
              - 0
              - field_path: "vat"
                column: "vat"
                operator: "="
                required: true
      - step: "Create document"
        action: "create"
        model: "data_import"
        save_as: "document"
        values:
          template_id: "REC: template.id"
      - step: "Create first data line"
        action: "create"
        model: "data_import.data"
        save_as: "line_1"
        values:
          import_id: "REC: document.id"
          sequence: 10
          data: '{"vat": "RESOLVEV004"}'
      - step: "Create second data line, same target"
        action: "create"
        model: "data_import.data"
        save_as: "line_2"
        values:
          import_id: "REC: document.id"
          sequence: 20
          data: '{"vat": "RESOLVEV004"}'
      - step: "Run Resolve"
        action: "call"
        target: "document"
        method: "action_resolve"
      - step: "Assert first line matched"
        action: "assert"
        target: "line_1"
        asserts:
          state:
            type: "value"
            expected: "matched"
      - step: "Assert second line conflict, pointing at the first"
        action: "assert"
        target: "line_2"
        asserts:
          state:
            type: "value"
            expected: "conflict"
          conflict_data_id:
            type: "m2o"
            expected: "REC: line_1"


          name: "Resolve Partner Four"
          vat: "RESOLVEV004"
      - step: "Create template"
        action: "create"
        model: "data_import_template"
        save_as: "template"
        values:
          name: "Resolve Template Four"
          code: "/"
          model_id: "REF: base.model_res_partner"
